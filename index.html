<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Hours</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>

<body>

    <!-- Header -->
    <div class="container mt-5">

        <h1 class="text-primary text-center">
            Store Hours
        </h1>

        <hr>

        <!-- Store Hours Table -->
        <table class="table table-striped table-bordered text-center">

            <thead class="table-dark">
                <tr>
                    <th>Day</th>
                    <th>Opening Hours</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>9:00 AM - 6:00 PM</td>
                </tr>

                <tr>
                    <td>Tuesday</td>
                    <td>9:00 AM - 6:00 PM</td>
                </tr>

                <tr>
                    <td>Wednesday</td>
                    <td>9:00 AM - 6:00 PM</td>
                </tr>

                <tr>
                    <td>Thursday</td>
                    <td>9:00 AM - 6:00 PM</td>
                </tr>

                <tr>
                    <td>Friday</td>
                    <td>9:00 AM - 6:00 PM</td>
                </tr>

                <tr>
                    <td>Saturday</td>
                    <td>10:00 AM - 4:00 PM</td>
                </tr>

                <tr>
                    <td>Sunday</td>
                    <td>Closed</td>
                </tr>
            </tbody>

        </table>

        <!-- Contact Form -->
        <h2 class="mt-5">Contact Us</h2>

        <form>

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    class="form-control"
                    minlength="5"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>

                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    class="form-control"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 id="name"></h1>
    <p id="role"></p>
  </header>

  <main class="container">
    <section class="card">
      <h2>About me</h2>
      <p id="intro"></p>
    </section>

    <section class="card">
      <h2>Skills</h2>
      <p id="skills"></p>
    </section>

    <section class="card">
      <h2>Projects</h2>
      <ul id="project-list" class="project-list"></ul>
    </section>

    <section class="card">
      <h2>Project counter</h2>
      <label for="new-projects">New projects this month</label>
      <input type="number" id="new-projects" value="1" min="0">
      <button type="button" id="count-btn">Count</button>
      <p id="total"></p>
    </section>
  </main>

  <footer class="footer">
    <p>PABW 2026/2027 · Meeting 8</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

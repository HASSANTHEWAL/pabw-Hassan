<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 id="name"></h1>
    <p id="role"></p>
  </header>

  <main class="container">
    <section class="card">
      <h2>About me</h2>
      <p id="intro"></p>
    </section>

    <section class="card">
      <h2>Skills</h2>
      <p id="skills"></p>
    </section>

    <section class="card">
      <h2>Projects</h2>

      <!-- one listener on #filter for all buttons -->
      <div id="filter">
        <button type="button" data-category="all" class="active">All</button>
        <button type="button" data-category="web">Web</button>
        <button type="button" data-category="tool">Tool</button>
        <button type="button" data-category="game">Game</button>
      </div>

      <!-- empty, dom.js fills it -->
      <ul id="project-list" class="project-list"></ul>
      <p id="empty-msg" hidden>No project in this category yet.</p>
    </section>

    <section class="card">
      <h2>Project counter</h2>
      <label for="new-projects">New projects this month</label>
      <input type="number" id="new-projects" value="1" min="0">
      <button type="button" id="count-btn">Count</button>
      <p id="total"></p>
    </section>

    <!-- P10: news from the API, app.js fills it -->
    <section class="card">
      <h2>Space News</h2>
      <p id="news-status" aria-live="polite"></p>
      <div id="news-list"></div>
    </section>

    <!-- my form from Meeting 3 -->
    <section class="card">
      <h2>Minecraft Form</h2>
      <form id="mc-form" novalidate>
        <p>
          <label for="player-name">Player Name:</label>
          <input type="text" id="player-name" name="player-name">
          <small id="player-name-error" class="error"></small>
        </p>

        <p>
          <label for="favorite-mode">Favorite Game Mode:</label>
          <select id="favorite-mode" name="favorite-mode">
            <option value="">Choose a mode</option>
            <option value="survival">Survival</option>
            <option value="creative">Creative</option>
            <option value="adventure">Adventure</option>
          </select>
          <small id="favorite-mode-error" class="error"></small>
        </p>

        <p>
          <label for="favorite-activity">Favorite Activity:</label>
          <input type="text" id="favorite-activity" name="favorite-activity">
          <small id="favorite-activity-error" class="error"></small>
        </p>

        <button type="submit" id="submit-btn" disabled>Submit</button>
        <p id="form-ok" hidden>Thanks, your answer is saved!</p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>PABW 2026/2027 · Meeting 10</p>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/dom.js"></script>
</body>
</html>
